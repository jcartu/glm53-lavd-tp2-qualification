    container_name: lavd-qualification
    network_mode: host
    gpus: all
    shm_size: 32g
    ipc: host
    init: true
    ulimits:
      memlock: -1
      stack: 67108864
    environment:
      CUDA_VISIBLE_DEVICES: 2,3
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
      CACHE_MODE: vram
    volumes:
