    - /home/josh/omp-workspace/drock-lmcache/lavd-qualification-20261001T231927Z/cache:/cache:rw
    - /home/josh/omp-workspace/drock-lmcache/lavd-qualification-20261001T231927Z:/evidence:rw
    entrypoint:
    - /usr/local/bin/lil-entrypoint
    command:
    - --preset
    - glm53-spark-tp2
    - --model
    - /model
    - --host
    - 127.0.0.1
    - --port
    - '8002'
    - --served-model-name
    - g53fq
    - --default-chat-template-kwargs
    - '{"reasoning_effort":"max","clear_thinking":true}'
    labels:
      field-lab.battery: r26
      lavd.campaign: lavd-qualification-20261001T231927Z
      lavd.arm: spark-tp2
